<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

.prepgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.prepi{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2)}.prepi .pn{font-weight:600}.prepi input{flex:1;min-width:0;width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch}.chip{flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}.chip span{opacity:.6;font-size:12px}.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.catrow{font-weight:700;background:var(--surface-2)}
.rcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.rccard{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}.rccard img{width:100%;height:150px;object-fit:cover;display:block;background:var(--line)}.rccard .rcb{padding:8px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.scancard{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.scancard.off{opacity:.75}
.scanraw{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.scangrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.link{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:2px 4px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input[type=number]{font-family:var(--mono)}
td input{padding:4px 6px;max-width:110px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.bar{display:flex;flex-direction:column;gap:3px}
.bar-track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:4px}
.empty{padding:20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;font-size:14px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:640px;padding:18px;display:flex;flex-direction:column;gap:14px}

svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="shopName">鍋物庫存與損益</h1>
      <span class="sub">食材庫存・配方成本・每日營收・盤點損耗</span>
      <span class="status" id="status">連線中…</span><span class="role" id="roleTag" hidden></span><button class="link" id="logoutBtn" data-act="logout" hidden>登出</button>
    </div>
    <nav role="tablist" id="nav"></nav>
  </div>
</header>
<div class="offline" id="offline" hidden>目前沒有網路，畫面顯示的是上次的資料，暫時無法儲存。</div>
<main id="main"><div class="empty">正在載入資料…</div></main>
<div id="modalRoot"></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
const TABS=[["overview","總覽"],["stock","庫存"],["moves","進貨・報廢"],["prep","每日備貨"],["mine","我的班表"],["menu","菜單成本"],["sales","每日營收"],["count","盤點"],["report","損益報表"],["attend","出勤薪資"],["roster","排班"],["settings","設定"]];
const EXP_CATS=["人事","租金","水電瓦斯","耗材包材","行銷廣告","平台抽成","其他"];
const DCOLS=["ingredients","movements","menu","sales","expenses","stocktakes","staff","receipts","punches","schedules","avail","payadj"];
const S={ingredients:[],movements:[],menu:[],sales:[],expenses:[],stocktakes:[],staff:[],receipts:[],punches:[],schedules:[],avail:[],payadj:[],settings:{shopName:"",targetFoodCost:38}};
let mySid="",myName="",db=null,me=null,tab="overview",canWrite=true,ready=false,role=null,pin="";
const OWNER_TABS=TABS.map(t=>t[0]).filter(k=>k!=="mine"),STAFF_TABS=["overview","stock","moves","prep","mine","count"];
const isOwner=()=>role==="owner";
const tabs=()=>TABS.filter(t=>(isOwner()?OWNER_TABS:STAFF_TABS).includes(t[0]));
try{const h=(location.hash||"").slice(1);if(TABS.some(t=>t[0]===h))tab=h;else{const s=localStorage.getItem("hp_tab");if(s&&TABS.some(t=>t[0]===s))tab=s;}}catch(e){}
let reportMonth=today().slice(0,7), salesDate=today(), moveFilter="all";

/* ---------- utils ---------- */
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const money=v=>(v<0?"−":"")+"$"+Math.round(Math.abs(v)).toLocaleString("zh-TW");
const qty=v=>{const r=Math.round(v*100)/100;return r.toLocaleString("zh-TW",{maximumFractionDigits:2})};
const pct=v=>isFinite(v)?(Math.round(v*10)/10).toFixed(1)+"%":"—";
const $=s=>document.querySelector(s);
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function ingById(id){return S.ingredients.find(i=>i.id===id);}
function menuById(id){return S.menu.find(m=>m.id===id);}

/* ---------- derived numbers ---------- */
let D={};
function derive(){
  const cost={},inQ={},inV={},stock={},usage={};
  for(const i of S.ingredients){inQ[i.id]=0;inV[i.id]=0;stock[i.id]=0;usage[i.id]=0;}
  for(const m of S.movements){if(!(m.ingId in stock))continue;
    if(m.type==="in"){stock[m.ingId]+=n(m.qty);inQ[m.ingId]+=n(m.qty);inV[m.ingId]+=n(m.qty)*n(m.unitCost);}
    else stock[m.ingId]-=n(m.qty);}
  for(const i of S.ingredients)cost[i.id]=inQ[i.id]>0?inV[i.id]/inQ[i.id]:n(i.cost);
  const recipeCost={};
  for(const m of S.menu){let c=0;for(const l of (m.lines||[]))c+=n(l.qty)*(cost[l.ingId]||0);recipeCost[m.id]=c;}
  for(const sd of S.sales){for(const [mid,q] of Object.entries(sd.items||{})){const m=menuById(mid);if(!m)continue;for(const l of (m.lines||[]))if(l.ingId in usage)usage[l.ingId]+=n(q)*n(l.qty);}}
  if(!prepMode())for(const i of S.ingredients)stock[i.id]-=usage[i.id];
  const since=addDays(today(),-7),prep7={};for(const m of S.movements)if(m.type==="prep"&&m.date>=since&&m.date<today())prep7[m.ingId]=(prep7[m.ingId]||0)+n(m.qty);
  const daily={};for(const i of S.ingredients)daily[i.id]=(prep7[i.id]||0)/7;
  for(const st of S.stocktakes)for(const l of (st.lines||[]))if(l.ingId in stock)stock[l.ingId]+=n(l.adjust);
  D={cost,stock,recipeCost,usage,daily};
}
const CATS=["生鮮","肉","菜","火鍋料","飲料","雜貨"];
const CAT_ALIAS={"肉品":"肉","肉類":"肉","豬肉":"肉","牛肉":"肉","雞肉":"肉","羊肉":"肉","蔬菜":"菜","青菜":"菜","菇類":"菜","海鮮":"生鮮","水產":"生鮮","海產":"生鮮","飲品":"飲料","酒水":"飲料","酒類":"飲料","湯底醬料":"雜貨","醬料":"雜貨","調味料":"雜貨","主食":"雜貨","乾貨":"雜貨","耗材":"雜貨","火鍋餃類":"火鍋料","丸類":"火鍋料","未分類":"其他"};
function catOf(i){const c=String(i.cat||"").trim();return CAT_ALIAS[c]||c||"其他";}
function catList(){const used=new Set(S.ingredients.map(catOf));return [...CATS.filter(c=>used.has(c)),...[...used].filter(c=>!CATS.includes(c)).sort((a,b)=>a==="其他"?1:b==="其他"?-1:a.localeCompare(b,"zh-Hant"))];}
let catSel="all";
function catChips(){const cs=catList();if(cs.length<2)return"";const cnt=c=>S.ingredients.filter(i=>catOf(i)===c).length;
  return `<div class="chips" role="tablist">${[["all","全部",S.ingredients.length],...cs.map(c=>[c,c,cnt(c)])].map(([k,l,nn])=>`<button class="chip${catSel===k?" on":""}" data-act="cat-sel" data-id="${esc(k)}">${esc(l)} <span>${nn}</span></button>`).join("")}</div>`;}
function catHidden(c){return catSel!=="all"&&catSel!==c?" hidden":"";}
function applyCat(){document.querySelectorAll("[data-cat]").forEach(el=>{el.hidden=catSel!=="all"&&el.dataset.cat!==catSel;});document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",b.dataset.id===catSel));}
function prepMode(){return (S.settings.stockMode||"prep")==="prep";}
function daysLeft(id){const d=D.daily&&D.daily[id];return d>0?(D.stock[id]||0)/d:Infinity;}
function lowList(){return S.ingredients.filter(i=>n(i.safety)>0&&(D.stock[i.id]||0)<n(i.safety)||(D.stock[i.id]||0)<=0&&n(i.safety)>0).sort((a,b)=>(D.stock[a.id]/(n(a.safety)||1))-(D.stock[b.id]/(n(b.safety)||1)));}
function stockState(i){const s=D.stock[i.id]||0,saf=n(i.safety);if(s<=0)return["缺貨","p-bad"];if(s<saf)return["該叫貨了","p-warn"];return["正常","p-good"];}
function inRange(d,a,b){return d>=a&&d<=b;}
function periodStats(a,b){
  let revenue=0,guests=0,theo=0,days=0;const byMenu={},daily={};
  for(const sd of S.sales){if(!inRange(sd.date,a,b))continue;days++;guests+=n(sd.guests);let dr=0,dc=0;
    for(const [mid,q] of Object.entries(sd.items||{})){const qq=n(q);if(!qq)continue;const m=menuById(mid);const price=sd.prices&&sd.prices[mid]!=null?n(sd.prices[mid]):(m?n(m.price):0);
      const c=(D.recipeCost[mid]||0)*qq;dr+=price*qq;dc+=c;
      const b=byMenu[mid]||(byMenu[mid]={qty:0,rev:0,cost:0});b.qty+=qq;b.rev+=price*qq;b.cost+=c;}
    dr+=n(sd.other);revenue+=dr;theo+=dc;daily[sd.date]={rev:dr,cost:dc,guests:n(sd.guests)};}
  let purchases=0,waste=0,useOut=0,prepC=0;const wasteBy={};
  for(const m of S.movements){if(!inRange(m.date,a,b))continue;const c=D.cost[m.ingId]||0;
    if(m.type==="in")purchases+=n(m.qty)*n(m.unitCost);
    else if(m.type==="waste"){waste+=n(m.qty)*c;wasteBy[m.ingId]=(wasteBy[m.ingId]||0)+n(m.qty)*c;}
    else if(m.type==="prep")prepC+=n(m.qty)*c;
    else useOut+=n(m.qty)*c;}
  let countLoss=0;for(const st of S.stocktakes){if(!inRange(st.date,a,b))continue;for(const l of (st.lines||[]))countLoss+=-n(l.adjust)*(n(l.cost)||D.cost[l.ingId]||0);}
  let exp=0;const expBy={};for(const e of S.expenses){if(!inRange(e.date,a,b))continue;exp+=n(e.amount);expBy[e.cat]=(expBy[e.cat]||0)+n(e.amount);}
  const actual=(prepMode()?prepC:theo)+waste+useOut+countLoss;
  return{revenue,guests,theo,prepC,days,byMenu,daily,purchases,waste,wasteBy,useOut,countLoss,exp,expBy,actual,gross:revenue-actual,net:revenue-actual-exp};
}
function monthRange(ym){const [y,m]=ym.split("-").map(Number);const last=new Date(y,m,0).getDate();return[ym+"-01",ym+"-"+String(last).padStart(2,"0")];}

/* ---------- writes ---------- */
async function w(fn,ok){if(!db){toast("尚未連上資料庫");return false;}try{await fn();if(ok)toast(ok);return true;}catch(e){console.error(e);toast(e&&e.code==="permission_denied"?"員工密碼不能做這件事，請老闆操作":e&&e.code==="bad_pin"?"密碼已變更，請重新登入":"儲存失敗："+(e&&e.message||"請檢查網路後再試"));if(e&&e.code==="bad_pin")logout();return false;}}
const meta=()=>({by:me||"",at:new Date().toISOString()});

/* ---------- render ---------- */
let raf=0;function schedule(){if(raf)return;raf=setTimeout(()=>{raf=0;render();},16);}
function renderNav(){if(!role){$("#nav").innerHTML="";return;}if(!tabs().some(t=>t[0]===tab))tab="overview";$("#nav").innerHTML=tabs().map(([k,l])=>`<button role="tab" id="t_${k}" aria-selected="${k===tab}" data-tab="${k}">${l}</button>`).join("");}
function render(){
  if(!role){renderLogin();return;}
  if(!ready){return;}
  derive();
  $("#shopName").textContent=S.settings.shopName||"鍋物庫存與損益";
  renderNav();
  const active=document.activeElement&&document.activeElement.id;
  const R={overview,stock,moves,prep,menu,sales,count,report,settings,attend,roster,mine}[tab];
  $("#main").innerHTML=`<section class="tab">${R()}</section>`;
  for(const [k,v] of Object.entries(dirty)){const el=document.getElementById(k);if(el)el.value=v;}
  updMvInfo();
  const mt=$("#mv_type");if(mt){const inT=mt.value==="in";if($("#mv_cost_w"))$("#mv_cost_w").hidden=!inT;$("#mv_exp_w").hidden=!inT;$("#mv_cnt_w").hidden=!inT;}
  document.querySelectorAll(".ctq").forEach(ctDiff);
  document.querySelectorAll(".ppq").forEach(ppAfter);
  if(active){const el=document.getElementById(active);if(el&&el.tagName!=="BUTTON")el.focus();}

/* values people typed but haven't saved survive live updates from other devices */
const dirty={};
function clearDirty(prefix){for(const k of Object.keys(dirty))if(k.startsWith(prefix))delete dirty[k];}
function ctDiff(t){const ing=t.dataset.ing,cell=document.getElementById("ctd_"+ing);if(!cell)return;if(t.value===""){cell.textContent="—";return;}const d=n(t.value)-(D.stock[ing]||0);const i=ingById(ing);cell.innerHTML=`<span class="pill ${Math.abs(d)<1e-9?"p-good":d<0?"p-bad":"p-warn"}">${d>0?"+":""}${qty(d)} ${esc(i?i.unit:"")}</span>`;}

    <div class="kpi"><span class="l">本月營收</span><span class="v">${money(mon.revenue)}</span><span class="n">已登記 ${mon.days} 天</span></div>
    <div class="kpi"><span class="l">本月食材成本率</span><span class="v">${pct(fcp)}</span><span class="n">目標 ${target}%　${isFinite(fcp)?(fcp<=target?'<span class="pill p-good">達標</span>':'<span class="pill p-bad">超標</span>'):""}</span></div>
    <div class="kpi"><span class="l">本月淨利（估）</span><span class="v">${money(mon.net)}</span><span class="n">已扣食材、損耗與費用</span></div>

      ${low.slice(0,20).map(i=>{const s=D.stock[i.id]||0,[l,c]=stockState(i),dl=daysLeft(i.id);return `<tr><td>${esc(i.name)}${isFinite(dl)?`<div class="small muted">約可撐 ${dl<1?"不到 1":Math.floor(dl)} 天</div>`:""}</td><td class="num">${qty(s)} ${esc(i.unit)}</td><td class="num">${qty(n(i.safety))}</td><td class="num">${D.daily[i.id]?qty(D.daily[i.id]):"—"}</td><td class="num">${qty(Math.max(0,n(i.par||i.safety*2)-s))} ${esc(i.unit)}</td><td><span class="pill ${c}">${l}</span></td></tr>`}).join("")}

function trendPanel(a,b,title){
  const days=[];for(let d=a;d<=b;d=addDays(d,1))days.push(d);
  const st=periodStats(a,b);const vals=days.map(d=>st.daily[d]||{rev:0,cost:0});
  const max=Math.max(1,...vals.map(v=>v.rev));
  const nice=niceMax(max);const W=Math.max(320,days.length*26+50),H=180,L=48,B=24,T=10,cw=(W-L-8)/days.length;
  const y=v=>T+(H-T-B)*(1-v/nice);
  let g="";for(let k=0;k<=4;k++){const v=nice*k/4;g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v>=1000?(v/1000)+"k":v}</text>`;}
  let bars="";days.forEach((d,ix)=>{const v=vals[ix],x=L+ix*cw+3,bw=Math.max(4,cw-6);
    if(v.rev>0)bars+=`<rect x="${x}" y="${y(v.rev)}" width="${bw}" height="${H-B-y(v.rev)}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1" rx="2"><title>${d} 營收 ${money(v.rev)}</title></rect>`;
    if(v.cost>0)bars+=`<rect x="${x+bw*0.25}" y="${y(v.cost)}" width="${bw*0.5}" height="${H-B-y(v.cost)}" fill="var(--accent)" rx="1"><title>${d} 理論食材成本 ${money(v.cost)}</title></rect>`;
    if(days.length<=16||ix%2===0)bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${d.slice(5).replace("-","/")}</text>`;});
  const has=vals.some(v=>v.rev>0);
  return `<div class="panel"><div class="row between"><h3>${title}</h3><div class="legend"><span><i class="sw" style="background:var(--accent-soft);border:1px solid var(--accent)"></i>營收</span><span><i class="sw" style="background:var(--accent)"></i>理論食材成本</span></div></div>
  ${has?`<div class="tbl"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,560)}px;max-height:240px" role="img" aria-label="${title}">${g}${bars}</svg></div>`:`<div class="empty">這段期間還沒有營收資料。到「每日營收」登記後，這裡會顯示每日長條圖。</div>`}</div>`;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}

  <p class="small muted" style="margin:0">現有量 = 進貨 − ${prepMode()?"每日備貨":"依配方從營收自動扣減"} − 報廢與領用 ± 盤點調整。${isOwner()?"單位成本取所有進貨的加權平均，還沒有進貨時用你填的參考成本。":"新增或修改食材品項請找老闆。"}</p>

let prepDate=null;
function prep(){
  const d=prepDate||today();
  const cats=catList();
  const recs=S.movements.filter(m=>m.type==="prep"&&m.date===d);
  const byIng={};for(const m of recs)byIng[m.ingId]=(byIng[m.ingId]||0)+n(m.qty);
  const byWho={};for(const m of recs){const k=whoOf(m)||"未記名";const b=byWho[k]||(byWho[k]={items:new Set(),n:0,lines:{}});b.items.add(m.ingId);b.n++;b.lines[m.ingId]=(b.lines[m.ingId]||0)+n(m.qty);}

const MIN_WAGE=196; // 2026 年基本工資（時薪）
const WDN="日一二三四五六";
const WEEK_ORDER=[1,2,3,4,5,6,0]; // 週一到週日
function staffName(id){const s=S.staff.find(x=>x.id===id);return s?s.name:"(已刪除)";}
function activeStaff(){return S.staff.filter(x=>x.active!==false).sort((a,b)=>String(a.name).localeCompare(String(b.name),"zh-Hant"));}
function wkStart(d){const x=new Date(d+"T00:00:00");const w=(x.getDay()+6)%7;return addDays(d,-w);}
function wdOf(d){return new Date(d+"T00:00:00").getDay();}
function hm2m(t){const m=String(t||"").match(/^(\d{1,2}):(\d{2})$/);return m?+m[1]*60+ +m[2]:null;}
function shiftsDef(){return Array.isArray(S.settings.shifts)?S.settings.shifts:[];}
function shiftById(id){return shiftsDef().find(s=>s.id===id);}
function shiftSpan(s){const a=hm2m(s.start)||0;let b=hm2m(s.end)||0;if(b<=a)b+=1440;return[a,b];}
function shiftHours(s){const[a,b]=shiftSpan(s);return (b-a)/60;}
function overlap(s1,s2){const[a1,b1]=shiftSpan(s1),[a2,b2]=shiftSpan(s2);return a1<b2&&a2<b1;}
function schedDoc(ws){return S.schedules.find(x=>x.id==="w"+ws);}
function pubShiftsOn(d,sid){const sc=schedDoc(wkStart(d));if(!sc||!sc.published||!sc.days||!sc.days[d])return[];return shiftsDef().filter(s=>(sc.days[d][s.id]||[]).includes(sid));}
function availOf(sid){return S.avail.find(a=>a.id===sid)||{offDays:[],offDates:[],maxDays:5};}
function isOff(sid,d){const a=availOf(sid);return (a.offDays||[]).includes(wdOf(d))||(a.offDates||[]).includes(d);}
const tsOf=(d,t)=>new Date(d+"T"+t+":00+08:00");
function fmtH(min){return (Math.round(min/6)/10).toLocaleString("zh-TW",{maximumFractionDigits:1});}

/* 出勤配對：上班卡 → 下一張下班卡（20 小時內）。回傳每段工作與異常 */
function workSessions(sid){
  const ps=S.punches.filter(p=>p.staffId===sid).sort((a,b)=>a.ts<b.ts?-1:1);
  const out=[];let open=null;
  for(const p of ps){
    if(p.kind==="in"){if(open)out.push({date:open.date,inP:open,outP:null,issue:"缺下班卡"});open=p;}
    else{if(open&&new Date(p.ts)-new Date(open.ts)<20*3600e3){out.push({date:open.date,inP:open,outP:p});open=null;}
      else{if(open){out.push({date:open.date,inP:open,outP:null,issue:"缺下班卡"});open=null;}out.push({date:p.date,inP:null,outP:p,issue:"缺上班卡"});}}
  }
  if(open)out.push({date:open.date,inP:open,outP:null,issue:new Date()-new Date(open.ts)<20*3600e3?"上班中":"缺下班卡"});
  const st=S.settings,brkOver=n(st.breakOver),brkMin=n(st.breakMin);
  for(const w of out){
    if(!w.inP||!w.outP){w.min=0;continue;}
    let a=new Date(w.inP.ts);const b=new Date(w.outP.ts);
    if(st.payFromShift!==false){const sh=pubShiftsOn(w.date,sid).map(s=>tsOf(w.date,s.start)).filter(t=>t>a&&t-a<3*3600e3).sort((x,y)=>x-y)[0];if(sh&&sh<b){w.early=Math.round((sh-a)/60000);a=sh;}}
    let m=Math.max(0,Math.floor((b-a)/60000));
    if(brkOver>0&&brkMin>0&&m>brkOver*60){m-=brkMin;w.brk=brkMin;}
    w.min=m;
  }
  return out;
}
/* 月薪計算（簡化估算）：每日 8 小時內正常、再 2 小時 ×4/3、超過 ×5/3；週正常工時超過 40 小時的部分 ×4/3；國定假日出勤 ×2 */
function payroll(sid,ym){
  const[a,b]=monthRange(ym);const hol=new Set(S.settings.holidays||[]);
  const ses=workSessions(sid);const byDay={};
  for(const w of ses){if(w.date<addDays(wkStart(a),0)||w.date>b)continue;(byDay[w.date]=byDay[w.date]||[]).push(w);}
  const days=Object.keys(byDay).sort();const res={normal:0,ot1:0,ot2:0,hol:0,days:0,issues:0,late:0,lateMin:0,rows:[]};
  let wk="",wkNormal=0;
  for(const d of days){
    const ws=wkStart(d);if(ws!==wk){wk=ws;wkNormal=0;}
    const list=byDay[d];const m=list.reduce((s,w)=>s+(w.min||0),0);
    let normal=0,ot1=0,ot2=0,hm=0;
    if(hol.has(d))hm=m;
    else{normal=Math.min(m,480);ot1=Math.min(Math.max(m-480,0),120);ot2=Math.max(m-600,0);
      const room=Math.max(0,2400-wkNormal);if(normal>room){ot1+=normal-room;normal=room;}wkNormal+=normal;}
    if(d<a)continue;
    const iss=list.filter(w=>w.issue&&w.issue!=="上班中").length;const lt=list.filter(w=>w.inP&&n(w.inP.late)>0);
    res.normal+=normal;res.ot1+=ot1;res.ot2+=ot2;res.hol+=hm;if(m>0)res.days++;res.issues+=iss;res.late+=lt.length;res.lateMin+=lt.reduce((s,w)=>s+n(w.inP.late),0);
    res.rows.push({date:d,list,m,normal,ot1,ot2,hol:hm,isHol:hol.has(d)});
  }
  const sf=S.staff.find(x=>x.id===sid)||{};const wage=n(sf.wage);res.wage=wage;
  res.base=Math.round(wage*(res.normal/60));res.otPay=Math.round(wage*(res.ot1/60*4/3+res.ot2/60*5/3));res.holPay=Math.round(wage*res.hol/60*2);
  res.adj=S.payadj.filter(x=>x.staffId===sid&&x.month===ym).reduce((s,x)=>s+n(x.amount),0);
  res.gross=res.base+res.otPay+res.holPay;res.total=res.gross+res.adj;
  return res;
}

function hm2(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}

/* ---------- 排班 ---------- */
let roWeek=wkStart(today()),roDraft=null,roDirty=false;
function roLoad(){const sc=schedDoc(roWeek);roDraft=JSON.parse(JSON.stringify((sc&&sc.days)||{}));roDirty=false;}
function roDays(){return [0,1,2,3,4,5,6].map(i=>addDays(roWeek,i));}
function roCell(d,sid){return (roDraft[d]&&roDraft[d][sid])||[];}
function roSet(d,shid,list){roDraft[d]=roDraft[d]||{};roDraft[d][shid]=list;roDirty=true;}
function roStats(){const st={};for(const x of activeStaff())st[x.id]={days:new Set(),h:0};
  for(const d of roDays())for(const s of shiftsDef())for(const id of roCell(d,s.id)){if(!st[id])st[id]={days:new Set(),h:0};st[id].days.add(d);st[id].h+=shiftHours(s);}return st;}
/* 往前看上週已排的班，避免連續上班超過 6 天（勞基法每 7 天至少 1 天例假） */
function workedOn(id,d){const ws=wkStart(d);const days=ws===roWeek?roDraft[d]:((schedDoc(ws)||{}).days||{})[d];return !!days&&Object.values(days).some(l=>(l||[]).includes(id));}
function streakIf(id,d){let k=1;for(let i=1;i<7;i++){if(workedOn(id,addDays(d,-i)))k++;else break;}for(let i=1;i<7;i++){if(workedOn(id,addDays(d,i)))k++;else break;}return k;}
function roCaps(){return{day:n(S.settings.maxDayH)||8,week:n(S.settings.maxWeekH)||40};}
function dayHours(id,d){return shiftsDef().filter(s=>roCell(d,s.id).includes(id)).reduce((t,s)=>t+shiftHours(s),0);}
function autoSchedule(){
  const defs=shiftsDef().slice().sort((a,b)=>shiftSpan(a)[0]-shiftSpan(b)[0]);const st=roStats();const cap=roCaps();
  const slots=[];for(const d of roDays())for(const s of defs)slots.push([d,s]);
  const want=([d,s])=>n((s.need||[])[wdOf(d)])-roCell(d,s.id).length;
  const ok=(x,d,s)=>{if(roCell(d,s.id).includes(x.id)||isOff(x.id,d))return false;
    if(defs.some(o=>o.id!==s.id&&roCell(d,o.id).includes(x.id)&&overlap(o,s)))return false;
    const sx=st[x.id],h=shiftHours(s);if(dayHours(x.id,d)+h>cap.day+1e-9||sx.h+h>cap.week+1e-9)return false;
    const max=Math.min(6,n(availOf(x.id).maxDays)||5);if(!sx.days.has(d)&&(sx.days.size>=max||streakIf(x.id,d)>6))return false;return true;};
  // 一輪一個人輪流補，缺人時平均分散到每一天
  let progress=true;
  while(progress){progress=false;
    for(const sl of slots){if(want(sl)<=0)continue;const[d,s]=sl;
      const c=activeStaff().filter(x=>ok(x,d,s)).sort((a,b)=>st[a.id].h-st[b.id].h||st[a.id].days.size-st[b.id].days.size||String(a.id).localeCompare(String(b.id)));
      if(!c.length)continue;const pick=c[0];roSet(d,s.id,roCell(d,s.id).concat([pick.id]));st[pick.id].days.add(d);st[pick.id].h+=shiftHours(s);progress=true;}}
  return slots.reduce((t,sl)=>t+Math.max(0,want(sl)),0);
}

    const rows=lines.map((l,ix)=>{const i=ingById(l.ingId);const lc=n(l.qty)*(D.cost[l.ingId]||0);c+=lc;return `<tr><td><select id="ml_i_${ix}" data-ix="${ix}" class="mli">${opts(l.ingId)}</select></td><td class="num"><input type="number" step="any" min="0" id="ml_q_${ix}" data-ix="${ix}" class="mlq" value="${esc(l.qty)}" style="text-align:right"></td><td class="small muted">${esc(i?i.unit:"")}</td><td class="num">${money(lc)}</td><td><button class="link danger" data-act="ml-del" data-ix="${ix}">移除</button></td></tr>`}).join("");
    const p=n($("#mn_price")?$("#mn_price").value:m.price);
    $("#ml_body").innerHTML=rows||`<tr><td colspan="5" class="muted small">還沒有食材，按下方「加入食材」。</td></tr>`;
    $("#ml_sum").innerHTML=`單份成本 <b class="num">${money(c)}</b>・毛利 <b class="num">${money(p-c)}</b>・成本率 <b class="num">${p?pct(c/p*100):"—"}</b>`;};
  modal(`<h2>${m.id?"編輯餐點配方":"新增餐點"}</h2><div class="form">
  <label class="f">名稱<input id="mn_name" value="${esc(m.name||"")}"></label>
  <label class="f">分類<input id="mn_cat" value="${esc(m.cat||"")}" placeholder="套餐、鍋底、加點"></label>
  <label class="f">售價<input type="number" step="any" min="0" id="mn_price" value="${esc(m.price??"")}"></label></div>
  <h3>一份所需食材</h3><div class="tbl"><table><thead><tr><th>食材</th><th class="num">用量</th><th>單位</th><th class="num">成本</th><th></th></tr></thead><tbody id="ml_body"></tbody></table></div>
  <div class="row between"><button class="btn" data-act="ml-add" ${S.ingredients.length?"":"disabled"}>加入食材</button><span class="small" id="ml_sum"></span></div>
  <div class="row between">${m.id?`<button class="btn danger" data-act="menu-del" data-id="${m.id}">刪除餐點</button>`:"<span></span>"}<div class="row"><button class="btn" data-act="modal-close">取消</button><button class="btn primary" data-act="menu-save" data-id="${m.id||""}">儲存</button></div></div>`);
  menuForm.lines=lines;menuForm.draw=draw;draw();}
function expForm(){modal(`<h2>新增營業費用</h2><div class="form">
  <label class="f">日期<input type="date" id="ex_date" value="${reportMonth===today().slice(0,7)?today():reportMonth+"-01"}"></label>

document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id&&t.closest("#main")&&(t.tagName==="SELECT")&&t.id!=="mv_filter")dirty[t.id]=t.value;
  if(t.id==="sl_date"){salesDate=t.value||today();clearDirty("sl_");render();}
  else if(t.id==="rp_month"){reportMonth=t.value||today().slice(0,7);render();}
  else if(t.id==="mv_filter"){moveFilter=t.value;render();}
  else if(t.id==="pp_date"){prepDate=t.value||today();delete dirty.pp_date;render();}
  else if(t.id==="mv_ing"){updMvInfo();}
  else if(t.id==="scan_input"){const f=t.files&&t.files[0];t.value="";if(f)startScan(f);}
  else if(t.classList.contains("sccat")){const r=scan&&scan.rows&&scan.rows[+t.dataset.k];if(r){r.cat=t.value;}}
  else if(t.id==="sc_date"){if(scan)scan.date=t.value;}
  else if(t.id==="up_input"){upFiles=[...(t.files||[])].filter(f=>/^image\//.test(f.type)||!f.type).slice(0,10);t.value="";updUp();}
  else if(t.id==="mv_type"){updMvInfo();const inT=t.value==="in";if($("#mv_cost_w"))$("#mv_cost_w").hidden=!inT;$("#mv_exp_w").hidden=!inT;$("#mv_cnt_w").hidden=!inT;}
  else if(t.classList.contains("mli")){menuForm.lines[+t.dataset.ix].ingId=t.value;menuForm.draw();}
});

function whoOf(d){return d.byName||(d.byRole==="owner"?"老闆":d.byRole==="staff"?"員工":"");}
/* ---------- receipt scan ---------- */
function countLines(list){/* list: [{ingId,counted}] → stocktake lines vs current system stock */
  return list.filter(x=>x.ingId&&x.counted!==""&&x.counted!=null&&isFinite(parseFloat(x.counted))).map(x=>{const exp=D.stock[x.ingId]||0,c=n(x.counted);
    return {ingId:x.ingId,expected:Math.round(exp*1000)/1000,counted:c,adjust:Math.round((c-exp)*1000)/1000,cost:Math.round((D.cost[x.ingId]||0)*100)/100};});}
async function saveCount(lines,date,note){if(!lines.length)return true;const id=genId();const doc={date,lines,note:note||"進貨時盤點",...meta()};
  const j=await api("put",{col:"stocktakes",id,doc});applyLocal("stocktakes",id,j.doc||doc);return true;}
let scan=null;
function stockLine(ingId,add,counted){const i=ingById(ingId);if(!i)return"";const has=counted!==""&&counted!=null&&isFinite(parseFloat(counted));const cur=has?n(counted):(D.stock[ingId]||0);return `${has?"盤點 ":"系統 "}${qty(cur)} → 進貨後 <b>${qty(cur+add)}</b> ${esc(i.unit)}${has&&Math.abs(n(counted)-(D.stock[ingId]||0))>1e-9?`　<span class=\"pill p-warn\">系統原本 ${qty(D.stock[ingId]||0)}</span>`:""}`;}
function scanRowOk(r){return !r.skip&&n(r.qty)>0&&(r.ingId||String(r.newName||"").trim());}
function scanAfter(r){if(r.skip)return '<span class="muted">不入庫</span>';return r.ingId?stockLine(r.ingId,n(r.qty),r.counted):`新品項，入庫後 <b>${qty(n(r.qty))}</b> ${esc(r.unit||"")}`;}
function updMvInfo(){const el=$("#mv_stock_info");if(!el)return;const id=$("#mv_ing")&&$("#mv_ing").value;const i=ingById(id);if(!i){el.textContent="";return;}
  const sys=D.stock[id]||0,q=n($("#mv_qty")&&$("#mv_qty").value),type=$("#mv_type")&&$("#mv_type").value;const cv=type==="in"&&$("#mv_cnt")?$("#mv_cnt").value:"";const has=cv!==""&&isFinite(parseFloat(cv));const cur=has?n(cv):sys;const after=type==="in"?cur+q:cur-q;
  el.innerHTML=`系統目前庫存：<b>${qty(sys)} ${esc(i.unit)}</b>${has?`　現場盤點：<b>${qty(cur)} ${esc(i.unit)}</b>${Math.abs(cur-sys)>1e-9?`（差 ${cur-sys>0?"+":""}${qty(cur-sys)}）`:""}`:""}${q>0?`　登記後：<b>${qty(after)} ${esc(i.unit)}</b>`:""}`;}
async function startScan(file){
  clearDirty("sc_");scan={status:"busy",step:"壓縮照片中…"};render();
  try{const data=await shrinkPhoto(file,1600,0.82);scan.step="AI 辨識中，約 10～30 秒…";render();
    const j=await api("scan",{photoData:data});
    if(j.receiptId&&j.receipt)applyLocal("receipts",j.receiptId,j.receipt);
    scan={status:"done",supplier:j.supplier||"",date:j.date||today(),photoId:j.photoId,photoUrl:j.photoUrl,receiptId:j.receiptId||"",
      rows:(j.items||[]).map(x=>({...x,qty:x.qty,unitCost:x.unitCost,newName:x.rawName||"",cat:CATS.includes(x.cat)?x.cat:"雜貨",unit:x.unit||x.rawUnit||""}))};
    if(!scan.rows.length){toast("單據上沒有讀到品項，請拍清楚一點再試");}
  }catch(e){scan=null;const d=e.data;if(d&&d.receiptId&&d.receipt)applyLocal("receipts",d.receiptId,d.receipt);toast(e.message||"辨識失敗");}
  render();}
function scanPanel(){
  const head=`<div class="row between"><h3>拍單據自動登記</h3>${scan&&scan.status==="done"?`<button class="link" data-act="scan-cancel">取消</button>`:""}</div>`;
  if(!scan)return `<div class="panel">${head}
    <p class="small muted" style="margin:0">對著送貨單或發票拍照，系統會自動讀出品項、數量（公斤、台斤會自動換算）${isOwner()?"和單價":""}。確認後一次寫入，庫存會同時更新。</p>
    <div><label class="btn" for="scan_input">拍攝進貨單據</label><input type="file" id="scan_input" accept="image/*" capture="environment" hidden></div></div>`;
  if(scan.status==="busy")return `<div class="panel">${head}<div class="empty">${esc(scan.step||"處理中…")}</div></div>`;
  const ok=scan.rows.filter(scanRowOk).length,nNew=scan.rows.filter(r=>scanRowOk(r)&&!r.ingId).length;
  return `<div class="panel">${head}
   <div class="row" style="gap:16px"><label class="f" style="flex-direction:row;align-items:center;gap:8px">進貨日<input type="date" id="sc_date" value="${esc(scan.date)}" style="width:auto"></label>
   ${scan.supplier?`<span class="small muted">供應商：${esc(scan.supplier)}</span>`:""}
   ${scan.photoUrl?`<a class="small" href="${esc(scan.photoUrl)}" target="_blank" rel="noopener">看單據照片</a>`:""}</div>
   ${scan.rows.length?`<div class="scanlist">${scan.rows.map((r,k)=>{const i=ingById(r.ingId);const u=i?i.unit:(r.unit||"");return `<div class="scancard${r.skip?" off":""}">
     <div class="scanraw"><b>${esc(i?i.name:r.rawName)}</b><span class="muted">單據：${esc(r.rawName)} ${qty(n(r.rawQty))} ${esc(r.rawUnit)}${isOwner()&&n(r.rawPrice)?" @ "+money(n(r.rawPrice)):""}</span>${i?`<span class="pill p-good">入庫到現有食材</span>`:`<span class="pill p-warn">新品項，會自動建立</span>`}${r.converted?`<span class="pill p-good">已換算成${esc(u)}</span>`:""}${r.ingId&&!r.unitOk?`<span class="pill p-warn">單位不同，請確認數量</span>`:""}<button class="link${r.skip?"":" danger"}" data-act="sc-skip" data-k="${k}">${r.skip?"改回入庫":"這項不入庫"}</button></div>
     ${r.skip?"":`<div class="scangrid">
      ${i?"":`<label class="f" style="grid-column:1/-1">品名<input class="scq" id="sc_n_${k}" data-k="${k}" data-f="newName" value="${esc(r.newName)}"></label>
      <label class="f">分類<select class="sccat" id="sc_cat_${k}" data-k="${k}">${CATS.map(c=>`<option${c===r.cat?" selected":""}>${c}</option>`).join("")}</select></label>
      <label class="f">單位<input class="scq" id="sc_u_${k}" data-k="${k}" data-f="unit" value="${esc(r.unit)}" placeholder="公斤、包、箱"></label>`}
      <label class="f">數量${u?`（${esc(u)}）`:""}<input type="number" step="any" min="0" class="scq" id="sc_q_${k}" data-k="${k}" data-f="qty" value="${esc(r.qty)}" inputmode="decimal"></label>
      ${isOwner()?`<label class="f">單價${u?`（每${esc(u)}）`:""}<input type="number" step="any" min="0" class="scq" id="sc_p_${k}" data-k="${k}" data-f="unitCost" value="${esc(r.unitCost)}" inputmode="decimal"></label>`:""}
      ${i?`<label class="f" style="grid-column:1/-1">盤點：進貨前現場還剩多少（${esc(i.unit)}）<input type="number" step="any" min="0" class="scq" id="sc_c_${k}" data-k="${k}" data-f="counted" value="${esc(r.counted??"")}" placeholder="系統目前 ${qty(D.stock[r.ingId]||0)}" inputmode="decimal"></label>`:""}
     </div>`}
     <div class="small">庫存：<span id="sc_after_${k}">${scanAfter(r)}</span></div></div>`}).join("")}</div>`:`<div class="empty">沒有讀到品項。</div>`}
   <div class="row between"><span class="small muted">AI 可能讀錯，請核對${isOwner()?"數量與單價":"品項與數量"}後再寫入。</span><button class="btn primary" data-act="scan-save" ${ok?"":"disabled"}>確認入庫 ${ok} 筆${nNew?`（含新品項 ${nNew}）`:""}</button></div></div>`;}

/* ---------- 單據照片 ---------- */
let upFiles=[],rcLimit=24;
function uploadPanel(){return `<div class="panel"><h3>上傳單據照片</h3>
  <p class="small muted" style="margin:0">從手機相簿選照片上傳（可一次選多張），會存到下方「單據照片」，老闆隨時可以查看。這裡只保存照片，不會自動登記庫存。</p>
  <div class="row" style="gap:8px;flex-wrap:wrap"><label class="btn" for="up_input">選擇照片</label><input type="file" id="up_input" accept="image/*" multiple hidden>
   <span class="small" id="up_names"></span></div>
  <label class="f">備註（選填）<input id="up_note" placeholder="例如：某某肉商 10/9 送貨單"></label>
  <div class="row" style="gap:8px"><button class="btn primary" data-act="up-send" id="up_send">上傳</button><button class="link" data-act="up-clear" id="up_clear">清除</button></div></div>`;}
function updUp(){const nm=$("#up_names"),b=$("#up_send"),c=$("#up_clear");if(nm)nm.textContent=upFiles.length?`已選 ${upFiles.length} 張：`+upFiles.map(f=>f.name).join("、"):"尚未選擇";if(b){b.disabled=!upFiles.length;b.textContent=upFiles.length?`上傳 ${upFiles.length} 張`:"上傳";}if(c)c.hidden=!upFiles.length;}
const driveId=u=>{const m=String(u||"").match(/^https:\/\/drive\.google\.com\/file\/d\/([A-Za-z0-9_\-]+)\//);return m?m[1]:"";};
function receiptsPanel(){
  const list=[...S.receipts].sort((a,b)=>String(b.date+(b.time||"")+b.updatedAt).localeCompare(String(a.date+(a.time||"")+a.updatedAt)));
  const shown=list.slice(0,rcLimit);
  return `<div class="panel"><div class="row between"><h3>單據照片</h3><span class="small muted">共 ${list.length} 張</span></div>
  ${shown.length?`<div class="rcgrid">${shown.map(r=>{const fid=driveId(r.photoUrl);return `<div class="rccard">
    ${fid?`<a href="${esc(r.photoUrl)}" target="_blank" rel="noopener"><img loading="lazy" alt="單據" src="https://drive.google.com/thumbnail?id=${fid}&sz=w400"></a>`:""}
    <div class="rcb"><div><b>${esc(r.date||"")}</b> <span class="muted">${esc(r.time||"")}</span></div>
    <div class="muted">${esc(whoOf(r))}・${r.source==="scan"?"拍照辨識":"上傳"}</div>
    ${r.supplier?`<div>${esc(r.supplier)}</div>`:""}${r.note?`<div>${esc(r.note)}</div>`:""}
    <div>${r.status==="done"?`<span class="pill p-good">已登記 ${n(r.count)} 筆</span>`:`<span class="pill p-mute">只有照片</span>`}</div>
    <div class="row between">${fid?`<a href="${esc(r.photoUrl)}" target="_blank" rel="noopener">看大圖</a>`:"<span></span>"}${isOwner()?`<button class="link danger" data-act="rc-del" data-id="${esc(r.id)}">刪除</button>`:""}</div></div></div>`}).join("")}</div>
  ${list.length>shown.length?`<button class="btn" data-act="rc-more">顯示更多</button>`:""}`:`<div class="empty">還沒有單據照片。</div>`}</div>`;}

/* ---------- photo ---------- */
let pendingPhoto=null;
function shrinkPhoto(file,max,quality){max=max||1400;quality=quality||0.72;return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{try{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",quality));}catch(e){rej(e);}};
  img.onerror=e=>{URL.revokeObjectURL(url);rej(e);};img.src=url;});}

/* ---------- backend (Google Apps Script) ---------- */
const API_URL=(()=>{const u=String((window.HOTPOT_CONFIG&&window.HOTPOT_CONFIG.apiUrl)||"").trim();return /^https:\/\/script\.google\.com\//.test(u)?u:"";})();
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function setStatus(s){$("#status").textContent=s;}
async function api(action,payload){
  if(!API_URL)throw Object.assign(new Error("尚未設定後端網址（config.js）"),{code:"config"});
  let r;
  const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),action==="scan"?120000:action==="upload"?90000:action==="putMany"?60000:action==="put"&&payload&&payload.doc&&payload.doc.photoData?90000:40000);
  try{r=await fetch(API_URL,{method:"POST",body:JSON.stringify(Object.assign({action,pin},payload||{})),redirect:"follow",signal:ctl.signal});}
  catch(e){throw Object.assign(new Error(e&&e.name==="AbortError"?"伺服器回應太久，請再試一次":"連不上伺服器，請檢查網路"),{code:"network"});}
  finally{clearTimeout(timer);}
  let j;try{j=await r.json();}catch(e){throw Object.assign(new Error("伺服器回應異常"),{code:"server"});}
  if(!j.ok)throw Object.assign(new Error(j.error||"操作失敗"),{code:j.code,data:j});
  return j;
}
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function sortCol(c){if(c==="ingredients"||c==="menu")S[c].sort((a,b)=>(a.order??999)-(b.order??999)||String(a.name).localeCompare(String(b.name),"zh-Hant"));}
function applyLocal(col,id,doc){
  if(col==="settings"){S.settings={...S.settings,...doc};}
  else{const list=S[col];const ix=list.findIndex(d=>d.id===id);const d={...doc,id};if(ix>=0)list[ix]=d;else list.push(d);sortCol(col);}
  cacheSave();schedule();
}
function removeLocal(col,id){if(S[col]){S[col]=S[col].filter(d=>d.id!==id);}cacheSave();schedule();}
function docRef(col,id){return{
  async set(body){id=id||genId();const j=await api("put",{col,id,doc:body});applyLocal(col,id,j.doc||body);},
  async delete(){await api("del",{col,id});removeLocal(col,id);}
};}
db={collection:c=>({doc:id=>docRef(c,id),add:body=>docRef(c,null).set(body)}),doc:p=>{const[c,id]=p.split("/");return docRef(c,id);}};

function applyAll(data){
  for(const c of DCOLS){S[c]=(data[c]||[]).map(d=>({...d}));sortCol(c);}
  const st=(data.settings||[]).find(d=>d.id==="main");S.settings={shopName:"",targetFoodCost:38,...(st||{})};
}
function cacheSave(){LS.set("hp_cache",JSON.stringify({role,S,at:Date.now()}));}
function cacheLoad(){try{const c=JSON.parse(LS.get("hp_cache")||"null");if(c&&c.role===role&&c.S){Object.assign(S,c.S);return c.at;}}catch(e){}return 0;}

let loading=false,lastSync=0;
async function refresh(quiet){
  if(loading||!role)return;loading=true;
  try{const j=await api("load");if((j.role==="owner"||j.role==="staff")&&j.role!==role){role=j.role;LS.set("hp_role",role);}if((j.sid||"")!==mySid){mySid=j.sid||"";LS.set("hp_sid",mySid);}if(j.name&&j.name!==myName){myName=j.name;LS.set("hp_name",myName);$("#roleTag").textContent=isOwner()?"老闆":(myName.indexOf("共用")<0?myName:"員工");}applyAll(j.data);lastSync=Date.now();cacheSave();ready=true;setStatus("已同步 "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}));$("#offline").hidden=true;schedule();}
  catch(e){
    if(e.code==="bad_pin"){logout("密碼已變更，請重新登入");}
    else{setStatus(e.code==="network"?"離線":"同步失敗");if(e.code==="network")$("#offline").hidden=false;else if(!quiet)toast(e.message);if(ready)schedule();else{$("#main").innerHTML='<div class="empty">資料載入失敗：'+esc(e.message)+'<br><br><button class="btn primary" id="retryLoad">重新載入</button></div>';const rb=$("#retryLoad");if(rb)rb.onclick=()=>{rb.disabled=true;rb.textContent="載入中…";refresh();};if(!refresh.retried){refresh.retried=1;setTimeout(()=>{if(!ready)refresh(true);},3000);}}}
  }finally{loading=false;}
}
function logout(msg){role=null;pin="";myName="";mySid="";myDraft=null;LS.del("hp_sid");LS.del("hp_name");ready=false;LS.del("hp_pin");LS.del("hp_role");LS.del("hp_cache");for(const c of DCOLS)S[c]=[];closeModal();render();if(msg)toast(msg);}

function renderLogin(){
  $("#roleTag").hidden=true;$("#logoutBtn").hidden=true;$("#nav").innerHTML="";setStatus("");
  $("#main").innerHTML=`<form class="login" id="loginForm" autocomplete="off">
    <h1>${esc(S.settings.shopName||"鍋物庫存")}</h1>
    <p class="muted" style="margin:0">請輸入你的登入密碼。員工可登記進貨、報廢與盤點；老闆可看全部報表。</p>
    <label class="f">密碼<input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="loginBtn">進入</button>
    ${API_URL?"":`<p class="small" style="color:var(--bad);margin:0">還沒設定後端網址：請在 config.js 填入 Google Apps Script 的部署網址。</p>`}
    <p class="small muted" style="margin:0">手機上可以把這個頁面「加到主畫面」，之後就像 App 一樣直接打開。</p>
  </form>`;
  const f=$("#pinInput");if(f)setTimeout(()=>f.focus(),50);
}
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="loginForm")return;ev.preventDefault();
  const btn=$("#loginBtn");const val=$("#pinInput").value.trim();if(!val)return;
  btn.disabled=true;btn.textContent="驗證中…第一次可能要 10 秒";pin=val;
  try{const j=await api("login");if(j.role!=="owner"&&j.role!=="staff")throw new Error("伺服器版本不符，請老闆重新部署後端");role=j.role;myName=j.name||"";mySid=j.sid||"";LS.set("hp_sid",mySid);LS.set("hp_pin",pin);LS.set("hp_role",role);LS.set("hp_name",myName);tab="overview";enter();}
  catch(e){pin="";btn.disabled=false;btn.textContent="進入";toast(e.code==="bad_pin"?"密碼錯誤":e.message);}
});
function enter(){
  $("#roleTag").hidden=false;$("#roleTag").textContent=isOwner()?"老闆":(myName&&myName.indexOf("共用")<0?myName:"員工");$("#logoutBtn").hidden=false;
  const at=cacheLoad();if(at){ready=true;}
  if(!ready)$("#main").innerHTML='<div class="empty">正在載入資料…（第一次開啟可能要 10 秒）</div>';
  render();refresh();
}
document.addEventListener("click",ev=>{const el=ev.target.closest('[data-act="logout"]');if(!el)return;ev.stopImmediatePropagation();if(confirmTwice(el,"logout"))logout("已登出");},true);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&role&&Date.now()-lastSync>20000)refresh(true);});
window.addEventListener("online",()=>{if(role)refresh(true);});
window.addEventListener("offline",()=>{$("#offline").hidden=false;setStatus("離線");});
setInterval(()=>{if(document.visibilityState==="visible"&&role&&!$("#modalRoot").innerHTML)refresh(true);},60000);
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}

function boot(){
  pin=LS.get("hp_pin")||"";role=pin?LS.get("hp_role"):null;myName=LS.get("hp_name")||"";mySid=LS.get("hp_sid")||"";
  if(role)enter();else render();
}
boot();
})();
</script>
