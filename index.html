<style>
/* Layout: sticky top bar + scrolling tab strip; each tab is a stacked column of panels, tables scroll in their own box */
:root{
  --bg:#eef1ee; --surface:#ffffff; --surface-2:#f5f7f5; --line:#d6ddd8; --fg:#1d2621; --muted:#5d6b63;
  --accent:#b8322a; --accent-ink:#ffffff; --accent-soft:#f6e3e0;
  --good:#2f7a4f; --good-soft:#e1f0e6; --warn:#a86a0c; --warn-soft:#f8ecd6; --bad:#b8322a; --bad-soft:#f6e3e0;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --surface-2:#222b26; --line:#33403a; --fg:#e6ece8; --muted:#9aa9a1;
  --accent:#e7675c; --accent-ink:#1a0d0b; --accent-soft:#3a201d;
  --good:#6cc590; --good-soft:#1d3427; --warn:#e4ab4d; --warn-soft:#3a2d16; --bad:#ef7a70; --bad-soft:#3d1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --surface-2:#222b26; --line:#33403a; --fg:#e6ece8; --muted:#9aa9a1;
  --accent:#e7675c; --accent-ink:#1a0d0b; --accent-soft:#3a201d;
  --good:#6cc590; --good-soft:#1d3427; --warn:#e4ab4d; --warn-soft:#3a2d16; --bad:#ef7a70; --bad-soft:#3d1f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:.02em}
.brand .sub{color:var(--muted);font-size:13px}
.status{margin-left:auto;font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-inline:16px;display:flex;flex-direction:column;gap:20px}
section.tab{display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--display);font-size:20px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.06em}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num,td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.04em}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--surface-2);color:var(--muted)}
button.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:6px;cursor:pointer}
button.btn:hover{background:var(--surface-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.primary:hover{background:var(--accent);filter:brightness(1.07)}
button.link{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:2px 4px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input[type=number]{font-family:var(--mono)}
td input{padding:4px 6px;max-width:110px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.bar{display:flex;flex-direction:column;gap:3px}
.bar-track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:4px}
.empty{padding:20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;font-size:14px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:640px;padding:18px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:14px;z-index:60}
svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.login{max-width:380px;margin:12vh auto 0;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--display);font-size:26px;margin:0}
.login input{font-size:22px;letter-spacing:.3em;text-align:center;font-family:var(--mono)}
.role{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.offline{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:6px 16px;text-align:center}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="shopName">鍋物庫存與損益</h1>
      <span class="sub">食材庫存・配方成本・每日營收・盤點損耗</span>
      <span class="status" id="status">連線中…</span><span class="role" id="roleTag" hidden></span><button class="link" id="logoutBtn" data-act="logout" hidden>登出</button>
    </div>
    <nav role="tablist" id="nav"></nav>
  </div>
</header>
<div class="offline" id="offline" hidden>目前沒有網路，畫面顯示的是上次的資料，暫時無法儲存。</div>
<main id="main"><div class="empty">正在載入資料…</div></main>
<div id="modalRoot"></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
const TABS=[["overview","總覽"],["stock","庫存"],["moves","進貨・報廢"],["menu","菜單成本"],["sales","每日營收"],["count","盤點"],["report","損益報表"],["settings","設定"]];
const EXP_CATS=["人事","租金","水電瓦斯","耗材包材","行銷廣告","平台抽成","其他"];
const S={ingredients:[],movements:[],menu:[],sales:[],expenses:[],stocktakes:[],settings:{shopName:"",targetFoodCost:38}};
let db=null,me=null,tab="overview",canWrite=true,ready=false,role=null,pin="";
const OWNER_TABS=TABS.map(t=>t[0]),STAFF_TABS=["overview","stock","moves","count"];
const isOwner=()=>role==="owner";
const tabs=()=>TABS.filter(t=>(isOwner()?OWNER_TABS:STAFF_TABS).includes(t[0]));
try{const h=(location.hash||"").slice(1);if(TABS.some(t=>t[0]===h))tab=h;else{const s=localStorage.getItem("hp_tab");if(s&&TABS.some(t=>t[0]===s))tab=s;}}catch(e){}
let reportMonth=today().slice(0,7), salesDate=today(), moveFilter="all";

/* ---------- utils ---------- */
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const money=v=>(v<0?"−":"")+"$"+Math.round(Math.abs(v)).toLocaleString("zh-TW");
const qty=v=>{const r=Math.round(v*100)/100;return r.toLocaleString("zh-TW",{maximumFractionDigits:2})};
const pct=v=>isFinite(v)?(Math.round(v*10)/10).toFixed(1)+"%":"—";
const $=s=>document.querySelector(s);
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function ingById(id){return S.ingredients.find(i=>i.id===id);}
function menuById(id){return S.menu.find(m=>m.id===id);}

/* ---------- derived numbers ---------- */
let D={};
function derive(){
  const cost={},inQ={},inV={},stock={},usage={};
  for(const i of S.ingredients){inQ[i.id]=0;inV[i.id]=0;stock[i.id]=0;usage[i.id]=0;}
  for(const m of S.movements){if(!(m.ingId in stock))continue;
    if(m.type==="in"){stock[m.ingId]+=n(m.qty);inQ[m.ingId]+=n(m.qty);inV[m.ingId]+=n(m.qty)*n(m.unitCost);}
    else stock[m.ingId]-=n(m.qty);}
  for(const i of S.ingredients)cost[i.id]=inQ[i.id]>0?inV[i.id]/inQ[i.id]:n(i.cost);
  const recipeCost={};
  for(const m of S.menu){let c=0;for(const l of (m.lines||[]))c+=n(l.qty)*(cost[l.ingId]||0);recipeCost[m.id]=c;}
  for(const sd of S.sales){for(const [mid,q] of Object.entries(sd.items||{})){const m=menuById(mid);if(!m)continue;for(const l of (m.lines||[]))if(l.ingId in usage)usage[l.ingId]+=n(q)*n(l.qty);}}
  for(const i of S.ingredients)stock[i.id]-=usage[i.id];
  for(const st of S.stocktakes)for(const l of (st.lines||[]))if(l.ingId in stock)stock[l.ingId]+=n(l.adjust);
  D={cost,stock,recipeCost,usage};
}
function stockState(i){const s=D.stock[i.id]||0,saf=n(i.safety);if(s<=0)return["缺貨","p-bad"];if(s<saf)return["低於安全量","p-warn"];return["正常","p-good"];}
function inRange(d,a,b){return d>=a&&d<=b;}
function periodStats(a,b){
  let revenue=0,guests=0,theo=0,days=0;const byMenu={},daily={};
  for(const sd of S.sales){if(!inRange(sd.date,a,b))continue;days++;guests+=n(sd.guests);let dr=0,dc=0;
    for(const [mid,q] of Object.entries(sd.items||{})){const qq=n(q);if(!qq)continue;const m=menuById(mid);const price=sd.prices&&sd.prices[mid]!=null?n(sd.prices[mid]):(m?n(m.price):0);
      const c=(D.recipeCost[mid]||0)*qq;dr+=price*qq;dc+=c;
      const b=byMenu[mid]||(byMenu[mid]={qty:0,rev:0,cost:0});b.qty+=qq;b.rev+=price*qq;b.cost+=c;}
    dr+=n(sd.other);revenue+=dr;theo+=dc;daily[sd.date]={rev:dr,cost:dc,guests:n(sd.guests)};}
  let purchases=0,waste=0,useOut=0;const wasteBy={};
  for(const m of S.movements){if(!inRange(m.date,a,b))continue;const c=D.cost[m.ingId]||0;
    if(m.type==="in")purchases+=n(m.qty)*n(m.unitCost);
    else if(m.type==="waste"){waste+=n(m.qty)*c;wasteBy[m.ingId]=(wasteBy[m.ingId]||0)+n(m.qty)*c;}
    else useOut+=n(m.qty)*c;}
  let countLoss=0;for(const st of S.stocktakes){if(!inRange(st.date,a,b))continue;for(const l of (st.lines||[]))countLoss+=-n(l.adjust)*(n(l.cost)||D.cost[l.ingId]||0);}
  let exp=0;const expBy={};for(const e of S.expenses){if(!inRange(e.date,a,b))continue;exp+=n(e.amount);expBy[e.cat]=(expBy[e.cat]||0)+n(e.amount);}
  const actual=theo+waste+useOut+countLoss;
  return{revenue,guests,theo,days,byMenu,daily,purchases,waste,wasteBy,useOut,countLoss,exp,expBy,actual,gross:revenue-actual,net:revenue-actual-exp};
}
function monthRange(ym){const [y,m]=ym.split("-").map(Number);const last=new Date(y,m,0).getDate();return[ym+"-01",ym+"-"+String(last).padStart(2,"0")];}

/* ---------- writes ---------- */
async function w(fn,ok){if(!db){toast("尚未連上資料庫");return false;}try{await fn();if(ok)toast(ok);return true;}catch(e){console.error(e);toast(e&&e.code==="permission_denied"?"員工密碼不能做這件事，請老闆操作":e&&e.code==="bad_pin"?"密碼已變更，請重新登入":"儲存失敗："+(e&&e.message||"請檢查網路後再試"));if(e&&e.code==="bad_pin")logout();return false;}}
const meta=()=>({by:me||"",at:new Date().toISOString()});

/* ---------- render ---------- */
let raf=0;function schedule(){if(raf)return;raf=setTimeout(()=>{raf=0;render();},16);}
function renderNav(){if(!role){$("#nav").innerHTML="";return;}if(!tabs().some(t=>t[0]===tab))tab="overview";$("#nav").innerHTML=tabs().map(([k,l])=>`<button role="tab" id="t_${k}" aria-selected="${k===tab}" data-tab="${k}">${l}</button>`).join("");}
function render(){
  if(!role){renderLogin();return;}
  if(!ready){return;}
  derive();
  $("#shopName").textContent=S.settings.shopName||"鍋物庫存與損益";
  renderNav();
  const active=document.activeElement&&document.activeElement.id;
  const R={overview,stock,moves,menu,sales,count,report,settings}[tab];
  $("#main").innerHTML=`<section class="tab">${R()}</section>`;
  for(const [k,v] of Object.entries(dirty)){const el=document.getElementById(k);if(el)el.value=v;}
  const mt=$("#mv_type");if(mt){const inT=mt.value==="in";$("#mv_cost_w").hidden=!inT;$("#mv_exp_w").hidden=!inT;}
  document.querySelectorAll(".ctq").forEach(ctDiff);
  if(active){const el=document.getElementById(active);if(el&&el.tagName!=="BUTTON")el.focus();}
}
/* values people typed but haven't saved survive live updates from other devices */
const dirty={};
function clearDirty(prefix){for(const k of Object.keys(dirty))if(k.startsWith(prefix))delete dirty[k];}
function ctDiff(t){const ing=t.dataset.ing,cell=document.getElementById("ctd_"+ing);if(!cell)return;if(t.value===""){cell.textContent="—";return;}const d=n(t.value)-(D.stock[ing]||0);const i=ingById(ing);cell.innerHTML=`<span class="pill ${Math.abs(d)<1e-9?"p-good":d<0?"p-bad":"p-warn"}">${d>0?"+":""}${qty(d)} ${esc(i?i.unit:"")}</span>`;}

function overview(){
  const t=today(),[ma,mb]=monthRange(t.slice(0,7));
  const day=periodStats(t,t),mon=periodStats(ma,mb);
  const target=n(S.settings.targetFoodCost)||38;
  const low=S.ingredients.filter(i=>(D.stock[i.id]||0)<n(i.safety)).sort((a,b)=>(D.stock[a.id]/(n(a.safety)||1))-(D.stock[b.id]/(n(b.safety)||1)));
  const soon=S.movements.filter(m=>m.type==="in"&&m.expiry&&m.expiry<=addDays(t,3)&&m.expiry>=addDays(t,-7)&&(D.stock[m.ingId]||0)>0).sort((a,b)=>a.expiry<b.expiry?-1:1);
  const fcp=mon.revenue?mon.actual/mon.revenue*100:NaN;
  const setup=isOwner()&&(!S.movements.length||!S.sales.length);
  return `
  ${setup?`<div class="panel"><h3>開始使用</h3><ol class="steps small">
    <li>到「設定」改店名；到「庫存」把範例食材改成你們實際的品項、單位、成本與安全庫存量。</li>
    <li>到「菜單成本」調整每道餐點的售價與配方用量，系統會自動算出單份成本與毛利率。</li>
    <li>到「進貨・報廢」登記一次期初庫存（把目前現場的量當作一筆進貨）。</li>
    <li>每天打烊後到「每日營收」輸入各品項賣出份數與來客數，庫存會依配方自動扣減。</li>
    <li>定期到「盤點」輸入實際數量，系統會算出理論與實際的差異，也就是損耗。</li></ol></div>`:""}
  ${isOwner()?`<div class="kpis">
    <div class="kpi"><span class="l">今日營收</span><span class="v">${money(day.revenue)}</span><span class="n">${day.guests?`來客 ${day.guests} 人・客單 ${money(day.revenue/day.guests)}`:"尚未登記"}</span></div>
    <div class="kpi"><span class="l">本月營收</span><span class="v">${money(mon.revenue)}</span><span class="n">已登記 ${mon.days} 天</span></div>
    <div class="kpi"><span class="l">本月食材成本率</span><span class="v">${pct(fcp)}</span><span class="n">目標 ${target}%　${isFinite(fcp)?(fcp<=target?'<span class="pill p-good">達標</span>':'<span class="pill p-bad">超標</span>'):""}</span></div>
    <div class="kpi"><span class="l">本月淨利（估）</span><span class="v">${money(mon.net)}</span><span class="n">已扣食材、損耗與費用</span></div>
  </div>`:""}
  <div class="grid2">
    <div class="panel"><div class="row between"><h3>需要叫貨</h3><span class="pill ${low.length?"p-warn":"p-good"}">${low.length} 項</span></div>
      ${low.length?`<div class="tbl"><table><thead><tr><th>食材</th><th class="num">現有</th><th class="num">安全量</th><th class="num">建議叫貨</th><th></th></tr></thead><tbody>
      ${low.slice(0,12).map(i=>{const s=D.stock[i.id]||0,[l,c]=stockState(i);return `<tr><td>${esc(i.name)}</td><td class="num">${qty(s)} ${esc(i.unit)}</td><td class="num">${qty(n(i.safety))}</td><td class="num">${qty(Math.max(0,n(i.par||i.safety*2)-s))} ${esc(i.unit)}</td><td><span class="pill ${c}">${l}</span></td></tr>`}).join("")}
      </tbody></table></div>`:`<div class="empty">所有食材都在安全庫存以上。</div>`}
    </div>

      ${soon.map(m=>{const i=ingById(m.ingId);const past=m.expiry<t;return `<tr><td>${esc(i?i.name:"(已刪除)")}</td><td class="small">${esc(m.date)}</td><td><span class="pill ${past?"p-bad":"p-warn"}">${esc(m.expiry)}${past?" 已過期":""}</span></td><td class="num">${qty(n(m.qty))} ${esc(i?i.unit:"")}</td></tr>`}).join("")}

    </div>
  </div>
  ${isOwner()?trendPanel(addDays(t,-13),t,"近 14 天營收與食材成本"):""}`;

function trendPanel(a,b,title){
  const days=[];for(let d=a;d<=b;d=addDays(d,1))days.push(d);
  const st=periodStats(a,b);const vals=days.map(d=>st.daily[d]||{rev:0,cost:0});
  const max=Math.max(1,...vals.map(v=>v.rev));
  const nice=niceMax(max);const W=Math.max(320,days.length*26+50),H=180,L=48,B=24,T=10,cw=(W-L-8)/days.length;
  const y=v=>T+(H-T-B)*(1-v/nice);
  let g="";for(let k=0;k<=4;k++){const v=nice*k/4;g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v>=1000?(v/1000)+"k":v}</text>`;}
  let bars="";days.forEach((d,ix)=>{const v=vals[ix],x=L+ix*cw+3,bw=Math.max(4,cw-6);
    if(v.rev>0)bars+=`<rect x="${x}" y="${y(v.rev)}" width="${bw}" height="${H-B-y(v.rev)}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1" rx="2"><title>${d} 營收 ${money(v.rev)}</title></rect>`;
    if(v.cost>0)bars+=`<rect x="${x+bw*0.25}" y="${y(v.cost)}" width="${bw*0.5}" height="${H-B-y(v.cost)}" fill="var(--accent)" rx="1"><title>${d} 理論食材成本 ${money(v.cost)}</title></rect>`;
    if(days.length<=16||ix%2===0)bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${d.slice(5).replace("-","/")}</text>`;});
  const has=vals.some(v=>v.rev>0);
  return `<div class="panel"><div class="row between"><h3>${title}</h3><div class="legend"><span><i class="sw" style="background:var(--accent-soft);border:1px solid var(--accent)"></i>營收</span><span><i class="sw" style="background:var(--accent)"></i>理論食材成本</span></div></div>
  ${has?`<div class="tbl"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,560)}px;max-height:240px" role="img" aria-label="${title}">${g}${bars}</svg></div>`:`<div class="empty">這段期間還沒有營收資料。到「每日營收」登記後，這裡會顯示每日長條圖。</div>`}</div>`;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}

/* ---------- photo ---------- */
let pendingPhoto=null;
function shrinkPhoto(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{try{const max=1400;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.72));}catch(e){rej(e);}};
  img.onerror=e=>{URL.revokeObjectURL(url);rej(e);};img.src=url;});}

/* ---------- backend (Google Apps Script) ---------- */
const API_URL=(()=>{const u=String((window.HOTPOT_CONFIG&&window.HOTPOT_CONFIG.apiUrl)||"").trim();return /^https:\/\/script\.google\.com\//.test(u)?u:"";})();
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function setStatus(s){$("#status").textContent=s;}
async function api(action,payload){
  if(!API_URL)throw Object.assign(new Error("尚未設定後端網址（config.js）"),{code:"config"});
  let r;
  const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),action==="put"&&payload&&payload.doc&&payload.doc.photoData?90000:40000);
  try{r=await fetch(API_URL,{method:"POST",body:JSON.stringify(Object.assign({action,pin},payload||{})),redirect:"follow",signal:ctl.signal});}
  catch(e){throw Object.assign(new Error(e&&e.name==="AbortError"?"伺服器回應太久，請再試一次":"連不上伺服器，請檢查網路"),{code:"network"});}
  finally{clearTimeout(timer);}
  let j;try{j=await r.json();}catch(e){throw Object.assign(new Error("伺服器回應異常"),{code:"server"});}
  if(!j.ok)throw Object.assign(new Error(j.error||"操作失敗"),{code:j.code});
  return j;
}
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function applyLocal(col,id,doc){
  if(col==="settings"){S.settings={...S.settings,...doc};}
  else{const list=S[col];const ix=list.findIndex(d=>d.id===id);const d={...doc,id};if(ix>=0)list[ix]=d;else list.push(d);sortCol(col);}
  cacheSave();schedule();
}
function removeLocal(col,id){if(S[col]){S[col]=S[col].filter(d=>d.id!==id);}cacheSave();schedule();}
function docRef(col,id){return{
  async set(body){id=id||genId();const j=await api("put",{col,id,doc:body});applyLocal(col,id,j.doc||body);},
  async delete(){await api("del",{col,id});removeLocal(col,id);}
};}
db={collection:c=>({doc:id=>docRef(c,id),add:body=>docRef(c,null).set(body)}),doc:p=>{const[c,id]=p.split("/");return docRef(c,id);}};

let loading=false,lastSync=0;
async function refresh(quiet){
  if(loading||!role)return;loading=true;
  try{const j=await api("load");if((j.role==="owner"||j.role==="staff")&&j.role!==role){role=j.role;LS.set("hp_role",role);}applyAll(j.data);lastSync=Date.now();cacheSave();ready=true;setStatus("已同步 "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}));$("#offline").hidden=true;schedule();}
  catch(e){
    if(e.code==="bad_pin"){logout("密碼已變更，請重新登入");}
    else{setStatus(e.code==="network"?"離線":"同步失敗");if(e.code==="network")$("#offline").hidden=false;else if(!quiet)toast(e.message);if(ready)schedule();}
  }finally{loading=false;}
}
function logout(msg){role=null;pin="";ready=false;LS.del("hp_pin");LS.del("hp_role");LS.del("hp_cache");for(const c of ["ingredients","movements","menu","sales","expenses","stocktakes"])S[c]=[];closeModal();render();if(msg)toast(msg);}

function renderLogin(){
  $("#roleTag").hidden=true;$("#logoutBtn").hidden=true;$("#nav").innerHTML="";setStatus("");
  $("#main").innerHTML=`<form class="login" id="loginForm" autocomplete="off">
    <h1>${esc(S.settings.shopName||"鍋物庫存")}</h1>
    <p class="muted" style="margin:0">請輸入店內密碼。員工密碼可登記進貨、報廢、營收與盤點；老闆密碼可看全部報表。</p>
    <label class="f">密碼<input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="loginBtn">進入</button>
    ${API_URL?"":`<p class="small" style="color:var(--bad);margin:0">還沒設定後端網址：請在 config.js 填入 Google Apps Script 的部署網址。</p>`}
    <p class="small muted" style="margin:0">手機上可以把這個頁面「加到主畫面」，之後就像 App 一樣直接打開。</p>
  </form>`;
  const f=$("#pinInput");if(f)setTimeout(()=>f.focus(),50);
}
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="loginForm")return;ev.preventDefault();
  const btn=$("#loginBtn");const val=$("#pinInput").value.trim();if(!val)return;
  btn.disabled=true;btn.textContent="驗證中…第一次可能要 10 秒";pin=val;
  try{const j=await api("login");if(j.role!=="owner"&&j.role!=="staff")throw new Error("伺服器版本不符，請老闆重新部署後端");role=j.role;LS.set("hp_pin",pin);LS.set("hp_role",role);tab="overview";enter();}
  catch(e){pin="";btn.disabled=false;btn.textContent="進入";toast(e.code==="bad_pin"?"密碼錯誤":e.message);}
});
function enter(){
  $("#roleTag").hidden=false;$("#roleTag").textContent=isOwner()?"老闆":"員工";$("#logoutBtn").hidden=false;
  const at=cacheLoad();if(at){ready=true;}
  if(!ready)$("#main").innerHTML='<div class="empty">正在載入資料…（第一次開啟可能要 10 秒）</div>';
  render();refresh();
}
document.addEventListener("click",ev=>{const el=ev.target.closest('[data-act="logout"]');if(!el)return;ev.stopImmediatePropagation();if(confirmTwice(el,"logout"))logout("已登出");},true);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&role&&Date.now()-lastSync>20000)refresh(true);});
window.addEventListener("online",()=>{if(role)refresh(true);});
window.addEventListener("offline",()=>{$("#offline").hidden=false;setStatus("離線");});
setInterval(()=>{if(document.visibilityState==="visible"&&role&&!$("#modalRoot").innerHTML)refresh(true);},60000);
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}

function boot(){
  pin=LS.get("hp_pin")||"";role=pin?LS.get("hp_role"):null;
  if(role)enter();else render();
}
boot();
})();
</script>

</body>
